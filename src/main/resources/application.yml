server:
  port: 8080
  address: 0.0.0.0

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/restart?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: restart_app
    password: ${DB_PWD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 90MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true

file:
  upload-path: /opt/restart-server/${file.upload-dir}
  upload-dir: uploads/

jwt:
  public-key-path: ${JWT_PUBLIC_KEY_PATH}