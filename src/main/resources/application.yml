server:
  port: 8080
  address: 0.0.0.0

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/restart?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: treasure
    password: ${DB_PWD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 90MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  public-key-path: ${JWT_PUBLIC_KEY_PATH}

restart:
  user:
    base-url: ${RESTART_USER_BASE_URL:http://127.0.0.1:8081}
